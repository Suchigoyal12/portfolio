<style>
  /* Tokens: DESIGN_SYSTEM.md §0.2 — single source of truth. */
  :root {
    --bg:          #E8E4DC;
    --surface:     #FBFAF6;
    --ink:         #111110;
    --ink-inverse: #F4F1E9;
    --muted:       #8A857C;
    --line:        #D9D4C8;
    --accent:      #B5522E;
    --ink-panel:   #0E0E0C;
    --highlight:   #FFFECE; /* marker wash — from Figma frame "about- designer" */
    --live:        #1F8A5B; /* transport/"live" state — DESIGN_SYSTEM.md §0.2 */
    /* spacing — DESIGN_SYSTEM.md §2.1 */
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px; --s-14:56px; --s-16:64px; --s-18:72px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--surface); font-family:'DM Sans', sans-serif; color:var(--ink); overflow:hidden; }
  @media (max-width: 899px) { html, body { overflow:auto; } }
  ::selection { background: var(--accent); color:#fff; }
  a { color: var(--ink); transition: color 0.15s ease; }
  a:hover { color: var(--accent); }

  /* ---------- Page shell — reused from index.html ---------- */
  .canvas { height:100vh; overflow:hidden; background:var(--surface); }
  .stage { position:relative; width:min(1440px, 100vw); height:100%; margin:0 auto; }
  @media (max-width: 899px) { .canvas { display:none; } }
  .mobile-stack { display:none; }
  @media (max-width: 899px) { .mobile-stack { display:block; min-height:100%; background:var(--surface); padding:48px 20px 96px; } }

  .mono-label { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }

  /* ---------- Zone 1: Left rail — markup + CSS reused from index.html ---------- */
  .rail-nav { position:absolute; left:24px; top:54.511%; display:flex; flex-direction:column; gap:10px; }
  .rail-nav a { font-family:'JetBrains Mono', monospace; font-weight:700; font-size:10px; letter-spacing:0.08em; line-height:1.46; text-transform:uppercase; text-decoration:none; color:var(--muted); position:relative; }
  .rail-nav a.active { color: var(--accent); padding-left:14px; }
  .rail-nav a.active::before { content:">"; position:absolute; left:0; top:0; }

  /* ---------- Toggles — placement/spacing per Figma frame "about" ---------- */
  .mode-toggle { position:absolute; top:12.444%; display:flex; align-items:center; gap:var(--s-2); padding:0 0 36px 0; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .mode-toggle.is-designer { left:221px; }
  .mode-toggle.is-person { left:578px; }
  .mode-toggle .radio { position:relative; width:12px; height:12px; display:flex; align-items:center; justify-content:center; flex:none; }
  .mode-toggle .radio::before { content:""; width:9.6px; height:9.6px; border-radius:50%; border:1px solid var(--muted); display:block; transition:border-color 0.16s cubic-bezier(0.2,0,0,1); }
  .mode-toggle .radio::after { content:""; position:absolute; width:4.8px; height:4.8px; border-radius:50%; background:var(--accent); opacity:0; }
  .mode-toggle .label { font-family:'JetBrains Mono', monospace; font-weight:400; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); transition:color 0.16s cubic-bezier(0.2,0,0,1); }
  .mode-toggle[aria-checked="true"] { cursor:default; }
  .mode-toggle[aria-checked="true"] .radio::before { border-color:var(--accent); }
  .mode-toggle[aria-checked="true"] .radio::after { opacity:1; }

  /* ---------- Content area ---------- */
  .mode-content { position:absolute; left:221px; top:188px; max-width:680px; }
  .mode-content .stub { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink); }

  /* ---------- DESIGNER branch — per Figma frame "about- designer" ---------- */
  .designer { display:flex; flex-direction:column; gap:48px; width:235px; }
  .designer .block { display:flex; flex-direction:column; gap:var(--s-2); }
  .designer .mono-label { margin:0; } /* .mono-label is div-scoped on Homepage; reset UA <p> margin so the 8px block gap holds */
  .designer .positioning { margin:0; font-family:'DM Sans', sans-serif; font-weight:400; font-size:14px; line-height:1.5; color:var(--ink); text-wrap:pretty; }
  .designer .hl { background:var(--highlight); box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .designer .signature { font-family:'JetBrains Mono', monospace; font-weight:400; font-size:10px; letter-spacing:0.08em; line-height:1.6; text-transform:uppercase; color:var(--muted); }
  .designer .motto { margin:0; font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size:24px; line-height:1.2; letter-spacing:0; color:var(--ink); }
  .designer .pill-row { display:flex; flex-wrap:wrap; gap:6px; }
  .designer .pill { font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:6px 12px; white-space:nowrap; transition:color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease; }
  .designer .pill:hover { color:var(--accent); border-color:var(--accent); }
  @media (prefers-reduced-motion: reduce) { .designer .pill { transition-duration:0.001ms !important; } }
  @media (max-width: 899px) { .designer { width:auto; max-width:340px; } }

  /* ---------- PERSON branch — per Figma "about- person/landing" + "about- person/on-play" ---------- */
  /* Frame coords are 1440x900, panel origin = .mode-content (221,188). Offsets below are frame-derived. */
  .person { position:relative; display:flow-root; }
  .person .eyebrow { margin:0; }                           /* flush with .mode-content top, matching the designer branch's first block */
  .person .eyebrow .hl { background:var(--highlight); padding:2px 5px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .play-btn { display:flex; align-items:center; gap:var(--s-2); margin:20px 0 0; padding:0; background:none; border:0; cursor:pointer; color:var(--live); transition:color 0.16s cubic-bezier(0.2,0,0,1); -webkit-tap-highlight-color:transparent; }
  .play-btn svg { display:block; width:14px; height:14px; flex:none; }
  .play-btn .play-label { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:inherit; }
  /* Lyrics crop: frame is 273x200 at 9px/16 (12.5 lines); held proportional at 13px/1.55. */
  /* Stepped reveal: the panel stays hidden until the first play, then stays up for the session. */
  /* Edge fade: ~one line-height (20px) top and bottom so the crop feathers instead of slicing glyphs. */
  .lyrics { -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%); mask-image:linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%); position:relative; width:272px; max-height:300px; padding-top:20px; padding-bottom:20px; margin-top:44px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; -ms-overflow-style:none; opacity:0; visibility:hidden; transform:translateY(12px); transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1), transform 0.4s cubic-bezier(0.16,1,0.3,1); }
  .lyrics.is-revealed { opacity:1; visibility:visible; transform:none; }
  .lyrics::-webkit-scrollbar { display:none; }
  /* Authored verse: each break is intentional, so a wrapped line hangs at --s-3 to read as a continuation. */
  .lyrics p { margin:0 0 var(--s-5); font-family:'DM Sans', sans-serif; font-weight:400; font-style:italic; font-size:13px; line-height:1.55; white-space:pre-line; text-wrap:pretty; color:var(--ink); opacity:0.45; transition:color 0.16s cubic-bezier(0.2,0,0,1), opacity 0.16s cubic-bezier(0.2,0,0,1); }
  .lyrics p:last-child { margin-bottom:0; }
  .lyrics p.is-active { color:var(--accent); opacity:1; }
  .lyrics p[role="button"] { cursor:pointer; }
  .lyrics p[role="button"]:focus-visible { outline:none; }
  /* frame x993 y91 w372 — exact at >=1440. Below 1440 the left edge is driven by fit()'s
     anchor lerp (772 -> 632) and then by the uniform stage scale; CSS carries the 1440 value only. */
  /* Revealed with the lyrics on first play (stepped reveal). */
  .shelf { position:absolute; left:772px; top:-61px; width:372px; display:flex; flex-direction:column; align-items:center; opacity:0; visibility:hidden; transform:translateY(12px); transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1), transform 0.4s cubic-bezier(0.16,1,0.3,1); }
  .shelf.is-revealed { opacity:1; visibility:visible; transform:none; }
  .shelf img { display:block; width:100%; height:auto; }
  .shelf .shelf-cap { margin:24px 0 0; text-align:center; width:calc(100% + 14px);   /* = 386px at full size: 314 in-frame at 13px, scaled 16/13 for the DS type size so it holds one line */ font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size:16px; line-height:1.3; color:var(--ink); }
  @media (max-width: 899px) { .shelf { position:static; width:100%; max-width:340px; margin-top:40px; } .shelf .shelf-cap { width:auto; max-width:314px; } .lyrics { width:auto; max-width:340px; } }
  /* Reduced motion: no crop, no highlight, no control — static readable text (§4.6). */
  @media (prefers-reduced-motion: reduce) {
    .lyrics { -webkit-mask-image:none; mask-image:none; }
    .lyrics, .shelf { max-height:none; overflow:visible; opacity:1; visibility:visible; transform:none; transition:none; }
    .lyrics p { opacity:1; color:var(--ink); transition:none; }
  }

  /* ---------- Photo marquee — ambient-motion exception, DESIGN_SYSTEM.md §4.7 ---------- */
  /* Breaks out of the 254px designer column so 4:3 frames read at a usable size. */
  /* Slot size is viewport-height-derived so the strip always fits the fixed 100vh canvas;
     JS measures the resolved width and recomputes --ph-set-w / --ph-dur (see phMeasure). */
  .ph-marquee { --ph-w:200px; width:900px; overflow:hidden; margin-top:-16px; }
  .ph-track { display:flex; gap:var(--ph-gap); height:116px; width:max-content; animation:ph-scroll var(--ph-dur) linear infinite; will-change:transform; }
  @keyframes ph-scroll { from { transform:translate3d(0,0,0); } to { transform:translate3d(calc(-1 * var(--ph-set-w)),0,0); } }
  .ph-marquee:hover .ph-track { animation-play-state:paused; }
  .ph-slot { position:relative; flex:none; width:var(--ph-w); aspect-ratio:4/3; border:1px solid var(--line); background:var(--surface); background-image:repeating-linear-gradient(135deg, rgba(138,133,124,0.10) 0 10px, transparent 10px 20px); }
  .ph-slot .n { position:absolute; left:8px; bottom:7px; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.1em; color:var(--muted); }
  @media (max-width: 899px) { .ph-marquee { width:100%; } }
  /* Safety net: on genuinely short viewports the branch can exceed 100vh — let it scroll
     rather than clipping the strip out of reach (the 899px-width rule doesn't cover height). */
     Scoped to >=1300 (Bands A/>=1440, where fit() writes no inline height); below 1300 the
     uniform scale shrinks the branch faster than the viewport, so the hatch isn't needed. */
  @media (max-height: 780px) and (min-width: 1300px) { .canvas { overflow-y:auto; } .stage { height:auto; min-height:100%; padding-bottom:48px; } }
  /* Reduced motion: no loop at all — static wrapped rows, first set only (§4.7). */
  @media (prefers-reduced-motion: reduce) {
    .ph-marquee { overflow:visible; }
    .ph-track { animation:none !important; flex-wrap:wrap; width:100%; height:auto; row-gap:var(--ph-gap); }
    .ph-track .ph-dupe { display:none; }
    .ph-track .ph-slot:nth-child(n+7) { display:none; } /* static cap: 6 slots max */
  }
</style>

    </nav>
    <div class="mode-content" id="modeContentMobile" style="position: static; left: auto; top: auto;"></div>
  </div>

<script>
  /* ---------- Photo marquee config — DESIGN_SYSTEM.md §4.7 ----------
     Swap PHOTOS for 4–10 entries; all geometry below re-derives. No logic edits needed. */
  const PHOTOS = [1, 2, 3, 4, 5, 6];      // placeholders — real photos drop in here later
  const PH_GAP = 12;                       // px between slots
  const PH_PX_PER_SEC = 22;                // ambient speed constant — tune this, not duration
  // Slot width comes from CSS (--ph-w, height-clamped); everything else derives from it + count.

  const phSlot = (i, dupe) =>
    '<div class="ph-slot' + (dupe ? ' ph-dupe' : '') + '"' + (dupe ? ' aria-hidden="true"' : '') + '>' +
      '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
    '</div>';

  // Full set duplicated once → rendered strip is PHOTOS.length × 2, so the reset is seamless.
  const PHOTO_MARQUEE_HTML =
    '<div class="ph-marquee" style="--ph-gap:' + PH_GAP + 'px">' +
      '<div class="ph-track">' +
        PHOTOS.map((_, i) => phSlot(i, false)).join('') +
        PHOTOS.map((_, i) => phSlot(i, true)).join('') +
      '</div>' +
    '</div>';

  // DESIGNER branch — static content above the marquee unchanged.
  const DESIGNER_HTML = [
    '<div class="designer" style="width: 254px">',
      '<div class="block">',
        '<p class="mono-label">HI THERE! I\u2019M SUCHI</p>',
        '<p class="positioning">I believe the definition of "done" has changed. I don\u2019t just hand off static pixels; I operate at the execution layer. I focus on <span class="hl">translating complex logic into systems that make users smile</span> :)</p>',
        '<p class="signature" style="display: none">PRODUCT DESIGNER \u00B7 2 YRS \u00B7 ENTERPRISE / AI PLATFORM TOOLING</p>',
      '</div>',
      '<div class="block">',
        '<p class="mono-label">/THE MOTTO</p>',
        '<p class="motto">Good design should disappear into the task getting done.</p>',
      '</div>',
      '<div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 36px; justify-content: normal; align-items: normal">',
      '<div class="block">',
        '<p class="mono-label">/ MORE ABOUT ME</p>',
        '<div class="pill-row">',
          '<span class="pill">Anchorenza</span>',
          '<span class="pill">Travel</span>',
          '<span class="pill">Sports</span>',
          '<span class="pill">Gardening</span>',
          '<span class="pill">Fun facts</span>',
        '</div>',
      '</div>',
      PHOTO_MARQUEE_HTML,
      '</div>',
    '</div>'
  ].join('');

  /* ---------- PERSON branch — voiceover-driven, Figma "about- person/*" ----------
     No audio exists yet. Every timed behaviour reads timeline.getTime() only. */
  const USE_AUDIO = false; // marker: real audio-backed driver swaps in here at deploy. do not build it now.

  const timeline = (() => {
    let started = 0, held = 0, running = false;
    return {
      duration: 125,                       // seconds — placeholder, real VO is ~2:05
      get running() { return running; },
      getTime() { return running ? held + (performance.now() - started) / 1000 : held; },
      play()  { if (running) return; started = performance.now(); running = true; },
      pause() { if (!running) return; held = this.getTime(); running = false; },
      seek(t) { held = Math.max(0, Math.min(t, this.duration)); started = performance.now(); },
      reset() { running = false; held = 0; started = 0; }
    };
  })();

  // Placeholder timings, weighted by paragraph length. Data-only — real cues replace these values.
  const CUES = [
    { t: 0,   para: 0 },
    { t: 2,   para: 1 },
    { t: 15,  para: 2 },
    { t: 24,  para: 3 },
    { t: 36,  para: 4 },
    { t: 49,  para: 5 },
    { t: 58,  para: 6 },
    { t: 74,  para: 7 },
    { t: 89,  para: 8 },
    { t: 109, para: 9 }
  ];

  const LYRICS = [
    'for who really am i?',
    'hm.. well i love dragonflies, they bring hope.\nhope of what? the hope of rain.\nyou see i love rain. didn\u2019t say i hate sun.\nsun reminds me of gardens and beaches.\nwho doesn\u2019t love that, right?',
    'but do they remind you of dancing? in the rain?\nor singing? whatever is your forte.\nwell i love both. didn\u2019t say i am good at em, now did i?',
    'does it sound like i love whimsy yet?\nyep i do love rom-coms and dramas, but the idea of being a hopeless romantic, in this world? i\u2019d leave that up to you.',
    'could you guess i am a morning person who loves late night parties?\nthat i can make you some amazing cocktails?\ni sound like tinder now alas.\nwell no, but i can be the monica of hosting house parties.',
    'i love pets, i have pets.\ni wish i could be them and cuddle up in tiny spaces to observe the world around.',
    'i am not good at poetry, that\u2019s why this, yeah.\nbut i do love poetry.\nnot a fan of how ai is changing it all. don\u2019t get me wrong, i do love the convenience we can create.\nbut, would you rather live in 2050s or the 1980s?',
    'i guess my friends value my opinion,\ni have friends, many, actually i am kinda extrovert.\ndid you create that yet? a vision? in the persona i mean.\nkinda contradicting isn\u2019t it? being a people person for who loves getting lost.',
    'i love horses, food, everything organic (so much that i like to grow some of my own), travel, so much travel, adventure, photography &amp; taking up opportunities (big time and any kind).\ni can swim; i can dance &amp; i won district in martial arts for my school.',
    'at this point you know me more than you should, but does that create a relevant persona? or should i go into the deets of what all did i accomplish, which i didn\u2019t think i could?\nagain, don\u2019t get me wrong. i believe in myself more than anyone could.'
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const ICON_RING = '<circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1" fill="none"/>';
  const ICON_PLAY  = '<svg viewBox="0 0 16 16" aria-hidden="true">' + ICON_RING + '<path d="M6.5 5.4 10.6 8 6.5 10.6Z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true">' + ICON_RING + '<rect x="6.1" y="5.4" width="1.3" height="5.2" fill="currentColor"/><rect x="8.6" y="5.4" width="1.3" height="5.2" fill="currentColor"/></svg>';

  const personHTML = () => [
    '<div class="person">',
      '<p class="mono-label eyebrow"><span class="hl">/ lets build a persona</span></p>',
      reduceMotion.matches ? '' :
        '<button type="button" class="play-btn" aria-pressed="false">' + ICON_PLAY + '<span class="play-label">Play</span></button>',
      '<div class="lyrics">',
        LYRICS.map(p => '<p>' + p + '</p>').join(''),
      '</div>',
      '<div class="shelf">',
        '<img src="uploads/shelf.png" alt="A shelf of books, potted plants, pine cones and a candle">',
        '<p class="shelf-cap">Always in \u201Clet me try this\u201D mode, curious, building &amp; exploring.</p>',
      '</div>',
    '</div>'
  ].join('');

  let personRaf = 0, personCue = -1, userScrolling = false, personScrollT = 0;
  const lyricPanels = () => Array.from(document.querySelectorAll('.lyrics'));

  function personCenter(panel, p) {
    if (!p || panel.scrollHeight <= panel.clientHeight) return;
    const top = p.offsetTop - (panel.clientHeight - p.offsetHeight) / 2;
    panel.scrollTo({ top: Math.max(0, top), behavior: reduceMotion.matches ? 'auto' : 'smooth' });
  }

  // Highlight advances on every cue; scroll is suspended while the reader is driving.
  function personApply(i) {
    if (i === personCue) return;
    personCue = i;
    lyricPanels().forEach(panel => {
      const ps = panel.querySelectorAll('p');
      ps.forEach((p, n) => p.classList.toggle('is-active', n === i));
      if (!userScrolling) personCenter(panel, ps[i]);
    });
  }

  function personIcons(playing) {
    document.querySelectorAll('.play-btn').forEach(b => {
      b.innerHTML = (playing ? ICON_PAUSE : ICON_PLAY) + '<span class="play-label">' + (playing ? 'Pause' : 'Play') + '</span>';
      b.setAttribute('aria-pressed', String(playing));
    });
  }

  function personStop() {
    timeline.pause();
    cancelAnimationFrame(personRaf); personRaf = 0;
    personIcons(false);
  }

  function personSync() {
    const t = timeline.getTime();
    if (t >= timeline.duration) { personApply(LYRICS.length - 1); personStop(); return; } // end of track: hold last, leave scroll
    let i = 0;
    for (let k = 0; k < CUES.length; k++) if (CUES[k].t <= t) i = CUES[k].para;
    personApply(i);
    personRaf = requestAnimationFrame(personSync);
  }

  // Intent, not the scroll event — programmatic scrolling fires `scroll` and would self-trigger.
  function personIntent() {
    userScrolling = true;
    clearTimeout(personScrollT);
    personScrollT = setTimeout(() => {
      userScrolling = false;
      lyricPanels().forEach(panel => personCenter(panel, panel.querySelectorAll('p')[personCue]));
    }, 3000);
  }

  const cueTimeFor = i => { const c = CUES.find(c => c.para === i); return c ? c.t : 0; };

  // Spotify-style scrub: clicking a paragraph highlights it and moves the timeline to its cue.
  function personSeekTo(i) {
    if (i < 0 || i >= LYRICS.length) return;
    document.querySelectorAll('.lyrics, .shelf').forEach(el => el.classList.add('is-revealed'));
    timeline.seek(cueTimeFor(i));
    clearTimeout(personScrollT); userScrolling = false;
    personCue = -1; personApply(i);
    if (!timeline.running) return;
    cancelAnimationFrame(personRaf);
    personRaf = requestAnimationFrame(personSync);
  }

  function personBind() {
    document.querySelectorAll('.play-btn').forEach(b => b.addEventListener('click', () => {
      if (timeline.running) { personStop(); return; }
      if (timeline.getTime() >= timeline.duration) { timeline.reset(); personCue = -1; }
      document.querySelectorAll('.lyrics, .shelf').forEach(p => p.classList.add('is-revealed')); // stepped reveal, first play only
      timeline.play();
      personIcons(true);
      personRaf = requestAnimationFrame(personSync);
    }));
    lyricPanels().forEach(panel => ['wheel', 'touchmove', 'pointerdown']
      .forEach(ev => panel.addEventListener(ev, personIntent, { passive: true })));
    if (reduceMotion.matches) return;               // no timeline in the reduced-motion path — nothing to seek
    lyricPanels().forEach(panel => {
      const ps = Array.from(panel.querySelectorAll('p'));
      ps.forEach((p, i) => {
        p.tabIndex = 0;
        p.setAttribute('role', 'button');
        p.addEventListener('click', () => personSeekTo(i));
        p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); personSeekTo(i); } });
      });
    });
  }

  // Leaving the branch always resets it — returning starts fresh.
  function personTeardown() {
    cancelAnimationFrame(personRaf); personRaf = 0;
    clearTimeout(personScrollT);
    timeline.reset();
    personCue = -1;
    userScrolling = false;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && timeline.running) personStop(); // stays paused on return
  });

  // Single state variable.
  let mode = null; // null | 'designer' | 'person'

  const toggles = Array.from(document.querySelectorAll('.mode-toggle'));
  const panels = Array.from(document.querySelectorAll('.mode-content'));

  function render() {
    personTeardown();
    toggles.forEach(t => t.setAttribute('aria-checked', String(t.dataset.mode === mode)));
    const html = mode === null
      ? ''
      : mode === 'designer' ? DESIGNER_HTML
      : mode === 'person' ? personHTML()
      : '<p class="stub">' + mode + ' branch</p>';
    panels.forEach(p => { p.innerHTML = html; });
    if (mode === 'person' && !reduceMotion.matches) personBind();
    applyLayout();
  }

  // Measure the resolved slot width and re-derive the loop-reset point + duration.
  // Count-driven: swapping PHOTOS to 4 or 10 needs no change here.
  function phMeasure() {
    document.querySelectorAll('.ph-marquee').forEach(m => {
      const slot = m.querySelector('.ph-slot');
      if (!slot) return;
      const w = slot.offsetWidth; // layout px — getBoundingClientRect() would return scaled px under fit()
      if (!w) return;
      const setW = PHOTOS.length * (w + PH_GAP);
      m.style.setProperty('--ph-set-w', setW + 'px');
      m.style.setProperty('--ph-dur', (setW / PH_PX_PER_SEC).toFixed(2) + 's');
    });
  }
  /* ---------- Responsive shell — ported from index.html fit() ----------
     Frame 1440, anchor 1300, identical band boundaries to Homepage so the rail and the
     left column sit at the same absolute position on both pages at every width.
     • >=1440: pure CSS (stage capped 1440, centered); anchors handed back to CSS.
     • 1300-1440: stage width tracks the viewport; .shelf lerps 772 -> 632.
     • 900-1300: uniform scale s = w/1300 on the whole stage; .shelf pinned at 632.
     • <900: early return, .mobile-stack owns it. */
  const stage = document.querySelector('.canvas .stage');
  const SHELF_L = [772, 632];  // [value@1440, value@1300] — left edge, px
  let shelfLeft = '';          // what applyLayout() writes; '' hands the anchor back to CSS

  // .shelf is destroyed and recreated by render(), so the anchor write lives here and is
  // re-run after every innerHTML swap as well as on resize. Absent .shelf => marquee only.
  function applyLayout() {
    const shelf = document.querySelector('.canvas .shelf');
    if (shelf) shelf.style.left = shelfLeft;
    phMeasure();
  }

  function clearScale() {
    stage.style.left = '';
    stage.style.transform = '';
    stage.style.transformOrigin = '';
    stage.style.height = '';
  }

  function fit() {
    if (!stage) return;
    const forced = window.__fw || parseInt((location.search.match(/[?&]fw=(\d+)/) || [])[1], 10) || 0;
    const w = forced || document.documentElement.clientWidth;
    const h = document.documentElement.clientHeight;
    if (w < 900) return; // mobile-stack owns this

    if (w >= 1440) {
      clearScale();
      stage.style.width = '';
      shelfLeft = '';
      applyLayout();
      return;
    }

    if (w >= 1300) {
      // Band A: full type, lerp the one anchor.
      clearScale();
      stage.style.width = w + 'px';
      const t = (w - 1300) / 140; // 0 at 1300 -> 1 at 1440
      shelfLeft = (SHELF_L[1] + (SHELF_L[0] - SHELF_L[1]) * t) + 'px';
      applyLayout();
      return;
    }

    // Band B: uniform scale-down of the whole stage, using the 1300 layout.
    const s = w / 1300;
    stage.style.width = '1300px';
    stage.style.height = (h / s) + 'px';
    shelfLeft = SHELF_L[1] + 'px';
    stage.style.left = '50%';
    stage.style.transformOrigin = 'top center';
    stage.style.transform = 'translateX(-50%) scale(' + s + ')';
    applyLayout();
  }

  fit();
  window.addEventListener('resize', fit);
  window.__fit = fit;

  // --- temporary test hook: ?fw=NNNN renders that width, scaled to fit the preview ---
  (function () {
    const forced = parseInt((location.search.match(/[?&]fw=(\d+)/) || [])[1], 10) || 0;
    if (!forced || !stage) return;
    const canvasEl = document.querySelector('.canvas');
    if (forced >= 1440) stage.style.width = '1440px';
    const real = document.documentElement.clientWidth;
    canvasEl.style.transformOrigin = 'top left';
    canvasEl.style.transform = 'scale(' + (real / forced) + ')';
  })();

  toggles.forEach(t => t.addEventListener('click', () => {
    if (mode === t.dataset.mode) return; // already active — no deselect
    mode = t.dataset.mode;
    render();
  }));

  render();
</script>
<script src="contact-modal.js"></script>
</body>
</html>
