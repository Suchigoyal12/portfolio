<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suchi. Portfolio '26 — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #E8E4DC;
    --paper:  #FBFAF6;
    --ink:    #111110;
    --muted:  #8A857C;
    --line:   #D9D4C8;
    --accent: #B5522E;
    --green:  #1F8A5B;
    --red:    #E5564E;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow: hidden;
  }
  ::selection { background: var(--accent); color: #fff; }
  @media (max-width: 899px) { html, body { overflow: auto; } }

  @keyframes wkFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wkPop  { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes wkPulse {
    0% { box-shadow: 0 0 0 0 rgba(31,138,91,0.45); }
    70% { box-shadow: 0 0 0 8px rgba(31,138,91,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,138,91,0); }
  }

  /* ============================================================
     CHROME BAR — matched to reference
     ============================================================ */
  .wk-chrome {
    position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    height: 46px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    border-bottom: 1px solid rgba(17,17,16,0.06);
    background: linear-gradient(to bottom, rgba(251,250,246,0.96), rgba(251,250,246,0.84));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    user-select: none;
  }
  .wk-tl-cluster { display: flex; align-items: center; gap: 8px; }
  .wk-dot {
    all: unset; width: 13px; height: 13px; border-radius: 999px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.18); flex: 0 0 auto; position: relative;
  }
  .wk-red   { background: var(--red); }
  .wk-green { background: var(--green); }
  .wk-dot svg { opacity: 0; transition: opacity 160ms ease; display: block; }
  .wk-tl-cluster:hover .wk-dot svg { opacity: 1; }

  .wk-navpill {
    display: inline-flex; align-items: center; height: 22px;
    border: 1px solid rgba(17,17,16,0.10); border-radius: 999px; background: rgba(17,17,16,0.03);
  }
  .wk-navpill button {
    all: unset; cursor: pointer; width: 26px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(17,17,16,0.55); font-family: var(--mono); font-size: 10px;
    position: relative;
  }
  .wk-navpill button span { opacity: 0; transition: opacity 160ms ease; }
  .wk-tl-cluster:hover .wk-navpill button span { opacity: 1; }
  .wk-navpill button:hover { color: var(--ink); background: rgba(17,17,16,0.05); }
  .wk-navpill button:first-child { border-right: 1px solid rgba(17,17,16,0.08); }

  /* tooltips */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; top: calc(100% + 9px); left: 50%;
    transform: translateX(-50%) translateY(-2px);
    background: #1C1C1A; color: #F2EEE6;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 5px 9px; border-radius: 6px; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease 200ms, transform 160ms ease 200ms; z-index: 30;
  }
  [data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }


  .wk-crumb {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    max-width: calc(100% - 340px); overflow: hidden;
    display: flex; align-items: baseline; gap: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(17,17,16,0.45); white-space: nowrap; pointer-events: none;
  }
  .wk-crumb-title { color: var(--ink); font-weight: 500; letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .wk-sep { opacity: 0.4; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- TODO: section-entrance animation (cards fanning in on scroll) hooks in here later. -->
<script src="contact-modal.js"></script>
<script type="text/babel" src="site-work/cards.jsx"></script>
<script type="text/babel" src="site-work/stage.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.WorkStage />);
</script>
</body>
</html>
