<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suchi. Portfolio '26</title>

  <!-- Link preview and search result. Static and site-wide: one card for every
       route, because per-route tags need prerendering (roadmap item 12) and a
       single honest card beats a bare URL today.

       The one exception is the page's address. In the source, canonical and
       og:url below name the homepage; the build rewrites both in each
       route's own file to that route's address (tools/reading-copy.mjs), so
       a case study is not read as a duplicate of the homepage.

       The four absolute URLs below are the live apex domain, set 2026-08-21
       when it went live (roadmap item 6). They must stay absolute and must
       stay on this host: og:image and twitter:image are what LinkedIn, Slack
       and X fetch the card from, and a card served from a host that does not
       match the link is the failure mode that shows nothing at all rather
       than erroring. canonical on the wrong host tells Google the wrong page
       is the real one.

       www redirects to the apex, so the apex is the canonical form.

       No em dash in the description, deliberately.

       og-image.png is a 1200x630 render of the homepage itself, not a designed
       card - an interim stand-in until Suchi supplies a card design (roadmap
       item 20). Regenerate it by screenshotting / at 1440x756 (the 1.91:1
       share ratio at a real desktop width, so the composition is not cropped)
       at deviceScaleFactor 2, then downsampling to 1200 wide. -->
  <meta name="description" content="Suchi - design technologist. Enterprise platform design at UiPath: permissions, AI governance, admin systems. Portfolio '26.">
  <link rel="canonical" href="https://suchigoyal.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Suchi. Portfolio '26">
  <meta property="og:title" content="Suchi. Portfolio '26">
  <meta property="og:description" content="Suchi - design technologist. Enterprise platform design at UiPath: permissions, AI governance, admin systems. Portfolio '26.">
  <meta property="og:url" content="https://suchigoyal.com/">
  <meta property="og:image" content="https://suchigoyal.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Suchi. Portfolio '26 homepage - design technologist, beyond product design.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Suchi. Portfolio '26">
  <meta name="twitter:description" content="Suchi - design technologist. Enterprise platform design at UiPath: permissions, AI governance, admin systems. Portfolio '26.">
  <meta name="twitter:image" content="https://suchigoyal.com/og-image.png">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- One request for the whole app, and it is the union of what the nine
       static pages each asked for separately. Widest subset wins on every
       family, so no page loses a weight it was using:
         Archivo 600                     (wordmark only)
         Cormorant Garamond 400/500/600 roman, 400/500/600/700 italic
         DM Sans 400–800
         JetBrains Mono 400–800
       shared.jsx also injects the Archivo link at runtime; that becomes
       redundant once it is here and can go when shared.jsx is ported.

       Italic 700 is the one weight NOT inherited from the static pages, and
       it is deliberate. Two <strong> spans in the Check Access hero lede ask
       for italic 700 (page-project.jsx:293). The static pages requested
       italic 400 only, so both builds were synthesizing a fake bold; the
       family has a real 700 italic: its variable axis is 300–700 in both
       styles, and the API rejects 1,800, so this asks for the real face.
       It renders those two words correctly and moves parity AWAY from the
       reference by design, because the reference renders them wrongly.
       Logged as an approved divergence in POST_MIGRATION_ROADMAP_V2 §Gate 0.
       Do not "restore" it to match the reference. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600;1,700&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
