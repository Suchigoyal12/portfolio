<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     TOKEN VALUES ARE PLACEHOLDERS — swap from DESIGN_SYSTEM.md.
     WORDMARK is set as text in Archivo — replace with the real
     wordmark treatment / SVG from the header component.
     --------------------------------------------------------------- */
  :root{
    --cream:#F4F0E7;
    --paper:#FAF7F0;
    --ink:#1C1B18;
    --muted:#6E685C;
    --line:#DCD5C6;
    --terracotta:#C2603C;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"DM Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,5vw,72px);
  }

  .sheet{
    width:min(1300px,100%);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:clamp(48px,9vh,120px) 0;
    display:grid;
    grid-template-columns:minmax(160px,1fr) minmax(0,3fr);
    gap:clamp(24px,4vw,64px);
  }

  /* --- left rail: identity + status ------------------------------ */
  .rail{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-top:.5em;
  }

  .wordmark{
    font-family:"Archivo",sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:-.01em;
    color:var(--ink);
    text-decoration:none;
    line-height:1.2;
  }

  .status{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--terracotta);
  }

  /* --- body ------------------------------------------------------ */
  .display{
    font-family:"Cormorant Garamond",serif;
    font-weight:300;
    font-size:clamp(38px,5.4vw,72px);
    line-height:1.06;
    letter-spacing:-.015em;
    max-width:18ch;
  }

  .sub{
    margin-top:clamp(20px,2.6vh,28px);
    font-size:clamp(15px,1.15vw,17px);
    line-height:1.55;
    color:var(--muted);
    max-width:46ch;
  }

  .actions{
    margin-top:clamp(32px,5vh,52px);
    display:flex;
    flex-wrap:wrap;
    gap:28px;
  }

  a.link{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    padding-bottom:4px;
    position:relative;
  }
  a.link::after{
    content:"";
    position:absolute;
    left:0;bottom:0;
    width:100%;height:1px;
    background:var(--ink);
    transform:scaleX(1);
    transform-origin:right;
    transition:transform 300ms var(--ease);
  }
  a.link:hover::after{transform:scaleX(0)}
  a.link .arrow{
    display:inline-block;
    transition:transform 300ms var(--ease);
  }
  a.link:hover .arrow{transform:translateX(-4px)}
  a.link.secondary{color:var(--muted)}
  a.link.secondary::after{background:var(--line)}

  @media (max-width:720px){
    .sheet{grid-template-columns:1fr;gap:28px}
  }
  @media (prefers-reduced-motion:reduce){
    a.link::after,a.link .arrow{transition:none}
  }
</style>
</head>
<body>

  <main class="sheet">
    <div class="rail">
      <a class="wordmark" href="/">Suchi Goyal</a>
      <span class="status">404 — Not found</span>
    </div>

    <div>
      <h1 class="display">Nothing lives at this address.</h1>
      <p class="sub">The page may have moved.</p>
      <div class="actions">
        <a class="link" href="/"><span class="arrow">←</span>&nbsp; Homepage</a>
        <a class="link secondary" href="/work">Work</a>
      </div>
    </div>
  </main>

</body>
</html>
